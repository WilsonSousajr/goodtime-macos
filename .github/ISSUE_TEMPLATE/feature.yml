name: Feature request
description: Propose a new capability for the app or backend
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Rough UX / API / data-model sketch. Optional.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - kmp (commonMain)
        - android
        - mac
        - backend
        - infra / ops
        - docs
    validations:
      required: true
